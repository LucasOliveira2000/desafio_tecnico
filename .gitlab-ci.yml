stages:
  - lint
  - test
  - build
  - deploy

# ──────────────────────────────────────────────
# Variáveis globais
# ──────────────────────────────────────────────
variables:
  # Tag da imagem baseada no hash curto do commit (imutável e rastreável)
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  # Tag "latest" para sempre apontar para o build mais recente da main
  DOCKER_IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

# ──────────────────────────────────────────────
# Stage: lint
# Verifica qualidade e estilo do código com flake8.
# Job falha se houver qualquer erro de lint.
# ──────────────────────────────────────────────
lint:
  stage: lint
  image: python:3.13-slim
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .pip-cache/
  before_script:
    - pip install --cache-dir .pip-cache flake8
  script:
    - flake8 app/ main.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

# ──────────────────────────────────────────────
# Stage: test
# Executa os testes unitários com pytest.
# Job falha se algum teste não passar.
# ──────────────────────────────────────────────
test:
  stage: test
  image: python:3.13-slim
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .pip-cache/
  before_script:
    - pip install --cache-dir .pip-cache pytest pytest-mock pandas openpyxl
  script:
    - pytest tests/ -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

# ──────────────────────────────────────────────
# Stage: build
# Constrói a imagem Docker e faz push para o
# GitLab Container Registry usando variáveis
# injetadas automaticamente pelo GitLab CI.
# ──────────────────────────────────────────────
build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$DOCKER_IMAGE" -t "$DOCKER_IMAGE_LATEST" .
    - docker push "$DOCKER_IMAGE"
    - docker push "$DOCKER_IMAGE_LATEST"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

# ──────────────────────────────────────────────
# Stage: deploy
# Simula o deploy para AWS ECS.
# Roda APENAS na branch main para evitar deploys acidentais.
# Em produção, substituir os "echo" pelo AWS CLI real com
# as variáveis $ECS_CLUSTER e $ECS_SERVICE configuradas
# nas CI/CD Variables do GitLab.
# ──────────────────────────────────────────────
deploy:
  stage: deploy
  image: python:3.13-slim
  script:
    - echo "=== Iniciando deploy para AWS ECS ==="
    - echo "Imagem: $DOCKER_IMAGE"
    - echo "aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment"
    - echo "aws ecs wait services-stable --cluster $ECS_CLUSTER --service $ECS_SERVICE"
    - echo "=== Deploy simulado com sucesso ==="
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
